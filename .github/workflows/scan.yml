name: Scan and publish phone edition

# Runs the same scan as the desktop app on GitHub's servers and refreshes the
# phone edition: twice a day (about 7:15 am and 4:15 pm Central), whenever the
# app's code changes (so laptop tweaks reach the phone automatically), and on
# demand with "Run workflow" on the Actions tab.
on:
  schedule:
    - cron: '15 12,21 * * *'
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-and-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Chicago
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r requirements-cloud.txt

      # Exits with an error (and publishes nothing) if the scan is incomplete,
      # so a bad run never replaces the last good one.
      - name: Scan and build the phone edition
        run: python build_site_cli.py --out site

      - name: Publish to the gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "HLSA Scout bot"
          git config user.email "hlsa-scout-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
